name = "doh-proxy"
main = "worker.js"
compatibility_date = "2026-05-30"

# 通用配置：fork 后不用改任何文件就能 `wrangler deploy`（部署到 workers.dev）。
# - 不写 [vars]：默认值都在代码里，个性化变量请在控制台「设置 → 变量和机密」里填。
# - keep_vars = true：部署时保留控制台里填的变量，同步上游、重新部署都不会被冲掉。
# - 自定义域名、Service Binding 等个人配置不要改这里，见 wrangler.prod.example.toml。
# - 国内访问 workers.dev 常被 SNI 阻断，实际使用请绑定自己的域名。
workers_dev = true
keep_vars = true

# 按客户端 IP 限速，防止被当公共 DoH 刷配额（浏览器 DoH 会并发查询，阈值不宜太低）
[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

# ECH 端点默认关闭。用 secret 设置不可猜测的路径，不要写进仓库：
#   wrangler secret put ECH_PATH
