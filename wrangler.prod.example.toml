# 个人生产配置模板。复制为 wrangler.prod.toml（已 gitignore，不会提交）后修改：
#   cp wrangler.prod.example.toml wrangler.prod.toml
#   wrangler deploy -c wrangler.prod.toml
# 只有 routes、Service Binding 这类必须写在配置文件里的东西才放这里；
# 普通变量（BEST_IPV4_CT 等）也可以继续在控制台填，keep_vars 会保留它们。
name = "doh-proxy"
main = "worker.js"
compatibility_date = "2026-05-30"
keep_vars = true

# 关闭 workers.dev（国内常被 SNI 阻断），只走自定义域名
workers_dev = false
# 显式关闭 Version/Preview URL：省略时会保留以前的设置，可能绕过自定义域名上的 WAF/Access
preview_urls = false
routes = [
  { pattern = "doh.example.com", custom_domain = true }   # 必改：你的域名
]

[[ratelimits]]
name = "RL"
namespace_id = "1001"
simple = { limit = 600, period = 60 }

# 可选：同账号部署了 cf-best-ip 时，用 Service Binding 调用优选池（不走公网）。
# 没有就删掉这一段和下面的 BEST_IP_URL。
# keep_vars 会保留线上已有变量：以前部署过 BEST_IP_URL 的，还要到控制台删掉它。
[[services]]
binding = "BESTIP"
service = "cf-best-ip"

[vars]
# 必改：host 必须在 cf-best-ip 的 ALLOWED_HOSTS 里，否则请求被拒、回退上游 IP
# limit / ech 参数由代码自动补成 limit=200&ech=1（条数可用 POOL_LIMIT 改）
BEST_IP_URL = "https://bestip.example.com/api/ips"
